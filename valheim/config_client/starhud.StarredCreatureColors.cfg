## Settings file was created by plugin Starred Creature Colors v1.10.2
## Plugin GUID: starhud.StarredCreatureColors

[Alerts]

## Show a center-screen message when a creature from the Creatures list appears. Each creature alerts once per play session.
# Setting type: Boolean
# Default value: true
Enabled = true

## Comma separated list of Name:Stars. A creature alerts if Name appears in its internal name (or display name), ignoring case, and it has at least Stars stars. Leave off :Stars to alert on any of that creature. Each match is written to LogOutput.log with the creature's internal name.
# Setting type: String
# Default value: Asksvin:2,Moose:2
Creatures = Asksvin:2,Moose:2

## Don't alert for tamed creatures.
# Setting type: Boolean
# Default value: true
IgnoreTamed = true

## Text shown before the creature's stars and name. A space is added after it automatically.
# Setting type: String
# Default value: Spotted:
MessagePrefix = Spotted:

[Danger]

## Draw a halo around creatures in the Creatures list. Tamed creatures get the tamed halo instead.
# Setting type: Boolean
# Default value: true
Enabled = true

## Comma separated list. A creature gets the danger halo if any entry appears in its internal name (or display name), ignoring case. Add :aggro to an entry (for example Dverger:aggro) to mark it only while it is hostile: provoked, for creatures that are neutral until attacked such as Dvergers, or chasing a target for anything else. Each match is written to LogOutput.log with the creature's internal name.
# Setting type: String
# Default value: TrollFrost,JotunWitch,Barka,Morgen,FallenValkyrie,SeekerBrute,Serpent,BonemawSerpent,Dverger:aggro
Creatures = TrollFrost,JotunWitch,Barka,Morgen,FallenValkyrie,SeekerBrute,Serpent,BonemawSerpent,Dverger:aggro

## Halo color for creatures in the Creatures list.
# Setting type: Color
# Default value: FF1A1AFF
HaloColor = FF1A1AFF

## Width in pixels of the danger halo.
# Setting type: Int32
# Default value: 6
# Acceptable value range: From 1 to 12
HaloWidth = 6

## Size of danger icons on the minimap and large map, relative to normal. 1 is normal size. (The HUDCompass bar uses CompassIconScale.)
# Setting type: Single
# Default value: 1.4
# Acceptable value range: From 1 to 2.5
IconScale = 1.4

## Draw danger icons on top of other pins, on the maps and on the HUDCompass bar, so they are not hidden in busy areas.
# Setting type: Boolean
# Default value: true
DrawOnTop = true

## Size of danger icons on the HUDCompass bar, relative to the size HUDCompass would give them. 1 is unchanged.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 1 to 3
CompassIconScale = 2

[Elevation]

## On the HUDCompass bar, show an arrow above a creature's marker when it is higher than you, or below it when it is lower. Needs HUDCompass.
# Setting type: Boolean
# Default value: true
Enabled = true

## How far above you, in meters, a creature must be before the up arrow appears. About one floor is 3 to 4 m.
# Setting type: Single
# Default value: 4
# Acceptable value range: From 0.5 to 50
AboveThresholdMeters = 4

## How far below you, in meters, a creature must be before the down arrow appears. About one floor is 3 to 4 m.
# Setting type: Single
# Default value: 4
# Acceptable value range: From 0.5 to 50
BelowThresholdMeters = 4

## Arrow width relative to the marker it belongs to.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0.2 to 1.5
ArrowSize = 0.5

## Arrow color when the creature is above you.
# Setting type: Color
# Default value: FFFFFFFF
UpColor = FFFFFFFF

## Arrow color when the creature is below you.
# Setting type: Color
# Default value: FFFFFFFF
DownColor = FFFFFFFF

[GameClock]

## Move Valheim Plus's game clock, for example to keep it clear of a HUD compass. Only applies when Valheim Plus is installed and its clock is on.
# Setting type: Boolean
# Default value: true
Enabled = true

## Move the clock down by this many times its own text height. 1 moves it down one line. Negative values move it up.
# Setting type: Single
# Default value: 1
MoveDownByHeights = 1

## Additional horizontal shift in pixels. Positive moves right.
# Setting type: Single
# Default value: 0
ExtraPixelsX = 0

## Additional vertical shift in pixels. Positive moves down.
# Setting type: Single
# Default value: 0
ExtraPixelsY = 0

[MissingIcons]

## Give an icon to tracked creatures that have none (no trophy or drops). Each iconless creature's internal name is written to LogOutput.log.
# Setting type: Boolean
# Default value: true
Enabled = true

## Comma separated rules of the form text=ItemName. If text appears in the creature's internal name (or display name), ignoring case, it uses the icon of the in-game item ItemName (an internal item name such as TrophyFrostTroll or Wisp). First match wins.
# Setting type: String
# Default value: TrollFrost=TrophyFrostTroll,ShadowPerson=Wisp,TrainingDummy=Wood
IconRules = TrollFrost=TrophyFrostTroll,ShadowPerson=Wisp,TrainingDummy=Wood

## Internal item name whose icon is used for iconless creatures no rule matches. Leave empty to leave them without an icon. A PNG named after the creature's internal name in BepInEx/config/StarredCreatureColors/icons overrides everything.
# Setting type: String
# Default value: 
FallbackIcon = 

[StarColors]

## Recolor the icons of starred creatures so they stand out on the map and on HUD compass mods.
# Setting type: Boolean
# Default value: true
Enabled = true

## Icon color for 1-star creatures.
# Setting type: Color
# Default value: FFD100FF
OneStarColor = FFD100FF

## Icon color for 2-star creatures.
# Setting type: Color
# Default value: FF1F1FFF
TwoStarColor = FF1F1FFF

## Width in pixels of the colored outline around starred icons. 0 turns the outline off.
# Setting type: Int32
# Default value: 3
# Acceptable value range: From 0 to 8
OutlineWidth = 3

## How strongly the icon itself is recolored. 0 keeps the original icon (outline only), 1 is fully recolored.
# Setting type: Single
# Default value: 0.75
# Acceptable value range: From 0 to 1
TintStrength = 0.75

## Show tamed creatures with their normal icon, even if they have stars.
# Setting type: Boolean
# Default value: true
IgnoreTamed = true

[Tamed]

## Draw a glowing halo around tamed creatures' icons. When on, this replaces star colors for tamed creatures.
# Setting type: Boolean
# Default value: true
Enabled = true

## Halo color for tamed creatures.
# Setting type: Color
# Default value: 33FF4CFF
HaloColor = 33FF4CFF

## Width in pixels of the tamed halo.
# Setting type: Int32
# Default value: 5
# Acceptable value range: From 1 to 12
HaloWidth = 5

## How strongly a tamed creature's icon itself is recolored with the halo color. 0 keeps the original icon.
# Setting type: Single
# Default value: 0
# Acceptable value range: From 0 to 1
TintStrength = 0

