## Settings file was created by plugin HUDCompass v1.2.1
## Plugin GUID: neobotics.valheim_mod.hudcompass

[A - HUD Compass]

## Enable or Disable the Compass HUD.@
# Setting type: Boolean
# Default value: true
Enable Compass = true

## Show or Hide the HUD compass. Use the Toggle Compass key to change in-game.
# Setting type: Boolean
# Default value: true
Show Compass = true

## Key used in-game to toggle the compass visibility.
# Setting type: KeyboardShortcut
# Default value: C + LeftAlt
Toggle Compass Key = C + LeftAlt

[B - Compass Display]

## Orient the compass based on the direction the player is facing, rather than the middle of the screen.
# Setting type: Boolean
# Default value: false
Use Player Direction = false

## Sets the overall scale of the compass on the screen
# Setting type: Single
# Default value: 0.75
# Acceptable value range: From 0.5 to 3
Compass Scale = 1.25

## Offset from the top of the screen in pixels.
# Setting type: Int32
# Default value: 0
Offset (Y) = 0

## Minimum distance from pin to show on compass.@
# Setting type: Int32
# Default value: 1
Distance (Minimum) = 1

## Maximum distance from pin to show on compass.@
# Setting type: Int32
# Default value: 300
Distance (Maximum) = 300

## Force player pins (multiplayer) to appear or not appear on the compass and map, or let the player decide. Overrides Show My Player Pin if not set to PlayerChoice.@
# Setting type: PlayerPinBehavior
# Default value: PlayerChoice
# Acceptable values: ForceOn, ForceOff, PlayerChoice
Player Pin Visibility = ForceOn

## Shows or hides your player pin (multiplayer) on the compass if playing no-map where visibility setting is not available. Overriden by server if Player Pin Behavior is not set to PlayerChoice.
# Setting type: Boolean
# Default value: true
Show My Player Pin = true

## Sets the overall scale of the pins on the on the screen
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.5 to 4
Pins Scale = 1

## Enlarge or shrink the scale of the pins at their furthest visible distance.
# Setting type: Single
# Default value: 0.25
Minimum Pin Size = 0.25

## (Optional) Show center mark graphic.
# Setting type: Boolean
# Default value: false
Show Center Mark = false

## Hide the HUD display while the large map is open.
# Setting type: Boolean
# Default value: true
Hide HUD While Map Open = true

