## Ignore location pins with these names (comma separated, no spaces). A string ending with an asterisk (*) will match any pin name starFire,House,Pin,Portal,Start,Haldir,Hildir,Death,Bed,Shout,Boss,Player,RandomEvent,Ping,EventAreating with that string. A string beginning with an asterisk (*) will match any pin name ending with that string.@
# Setting type: String
# Default value: Silver,Obsidian,Copper,Tin
Pin Names = Silver,Obsidian,Copper,Tin,Shadow*

## Ignore location pins of these types (comma separated, no spaces). Types include: .@
