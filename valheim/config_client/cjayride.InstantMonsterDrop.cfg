## Settings file was created by plugin Instant Monster Drop v0.8.2
## Plugin GUID: cjayride.InstantMonsterDrop

[General]

## Enable this mod
# Setting type: Boolean
# Default value: true
Enabled = true

## Delay before dropping loot
# Setting type: Single
# Default value: 0.05
DropDelay = 0.05

## Seconds the ragdoll stays on the ground before it is destroyed
# Setting type: Single
# Default value: 60
DestroyDelay = 0.05

## Seconds before dropped monster loot can be auto-picked up. 0 is vanilla auto-pickup timing
# Setting type: Single
# Default value: 1
AutoPickupDelay = 0

## Auto-pickup radius in meters
# Setting type: Single
# Default value: 2.5
AutoPickupRange = 5

[Notification]

## Show the stacked loot window. Disable to restore vanilla one-at-a-time pickup messages
# Setting type: Boolean
# Default value: true
Enabled = true

## Corner of the screen the window is offset from
# Setting type: NotificationAnchor
# Default value: BottomRight
# Acceptable values: BottomRight, BottomLeft, TopRight, TopLeft
Anchor = BottomRight

## Horizontal offset from the chosen corner, in pixels
# Setting type: Int32
# Default value: 20
WindowX = 20

## Vertical offset from the chosen corner, in pixels
# Setting type: Int32
# Default value: 20
WindowY = 50

## Loot window width in pixels
# Setting type: Int32
# Default value: 250
WindowWidth = 250

## Loot window height in pixels
# Setting type: Int32
# Default value: 120
WindowHeight = 120

## Window background opacity from 0 (invisible) to 1 (solid)
# Setting type: Single
# Default value: 0.72
Opacity = 0.72

## Seconds each pickup line stays in the window
# Setting type: Single
# Default value: 8
Linger = 16

## Font size for pickup names and amounts
# Setting type: Int32
# Default value: 15
FontSize = 15

## Draw the gold side bar and top line on the loot window
# Setting type: Boolean
# Default value: false
ShowBorders = false

## Draw a dark stroke around loot text so it stays readable
# Setting type: Boolean
# Default value: true
TextOutline = true

## Item name color
# Setting type: Color
# Default value: FFFFFFFF
TextColor = FFFFFFFF

## Item count color
# Setting type: Color
# Default value: F2E6BFFF
AmountColor = F2E6BFFF

## Text outline color
# Setting type: Color
# Default value: 000000FF
OutlineColor = 000000FF

