Force False Methods = 

[3 - Retroactive]

## Automatically grant EVERY achievement your character already earned, once, next time you load into a world. Off by default, and you do not need it: 'unshamed retro' in the console previews the list and lets you pick individual ones whether this is on or off. Turn this on only if you want the lot without looking.
# Setting type: Toggle
# Default value: Off
# Acceptable values: Off, On
Enable Retroactive = Off

[4 - Guide]

## The achievements panel stops hiding things. Secret achievements show, every achievement opens its details, rows you haven't finished show their real name and numbers instead of ??? / ???, and unfinished ones sort to the top. Spoilers, obviously.
# Setting type: Toggle
# Default value: Off
# Acceptable values: Off, On
Reveal Requirements = Off

## Show a panel next to the achievement details explaining in plain English what the achievement actually checks, the difficulty it needs and how far along you are.
# Setting type: Toggle
# Default value: Off
