## Settings file was created by plugin Unshamed v1.0.8
## Plugin GUID: Azumatt.Unshamed

[1 - General]

## Master switch. Off means the mod touches nothing.
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Enabled = On

## The fix. Achievements.CanGetAchievements is forced true, so none of the four cheat checks can stop you earning: Game.isModded, m_usedCheats, cheated items, cheated worlds. Nothing gets cleared. Vanilla still records all four, spawned items still carry m_cheated onto the server, and the warnings that used to say achievements were disabled get reworded instead of hidden. Turn this off and you are back to vanilla, disqualified for having BepInEx.
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Ignore Cheat Flags = On

## Show the vanilla unlock popup for each achievement the retroactive pass grants. Off because a big backlog means a lot of popups at once.
# Setting type: Toggle
# Default value: Off
# Acceptable values: Off, On
Show Popups = Off

[2 - Overrides]

## Comma separated Type::Method whose bool return gets forced true. A compatibility hatch for when a game patch moves something and the mod stops working.
# Setting type: String
