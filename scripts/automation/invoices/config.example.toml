# invoices-sync configuration. Copy to C:\automation\invoices\config.toml and
# replace the placeholders. Every text value is quoted. The SSH key goes in
# Credential Manager as invoices/ssh-key, never here. The run fails with a clear
# message until no placeholder is left.

[sftp]
host = "<server IP address or host name>"   # must match the known_hosts entry
port = 22
user = "<sftp user>"
folder = "/<folder>"                        # as the SFTP login sees it, after any chroot

[sheet]
spreadsheet_id = "<ID>"                     # from .../spreadsheets/d/<ID>/edit
worksheet = "<tab>"                         # the tab name

# One block per entity. Add more with no code change. Each block's column is
# replaced from start_cell to the bottom of the tab, so no two can share a column.
[[entities]]
code = "<entity>"                           # lowercase; used in the run's report
enabled = true                              # false skips it and leaves its block alone
file = "inv_<entity>.txt"                   # the file's name in the folder above
start_cell = "<cell>"                       # the first data cell, below any header, like B5

# Optional: the push notifications' words. Leave a block or line out to keep what's shown
# here. Any of these can go in {braces}: {command}, {process}, {run_id}, {ok}, {unchanged},
# {failed}, and {total}. Keep them short, since they're read on a watch.
[notifications.pass]
title = "{command}"
message = "PASS"

[notifications.fail]
title = "{command}"
message = "FAIL"
