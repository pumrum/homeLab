[project]
name = "buildium-portal"
version = "0.1.0"
description = "Automations for a property management site, sharing one sign-in flow"
requires-python = ">=3.13,<3.14"
dependencies = [
    "automation-common",
    "pypdf>=6.0",
]

[project.scripts]
buildium-gl = "buildium_portal.gl_main:main"
buildium-statements = "buildium_portal.main:main"

[tool.uv.sources]
automation-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
