[project]
name = "innago-portal"
version = "0.1.0"
description = "Automations for a property management site, sharing one sign-in"
requires-python = ">=3.13,<3.14"
dependencies = [
    "automation-common",
    "pypdf>=6.0",
]

[project.scripts]
innago-invoices = "innago_portal.main:main"

[tool.uv.sources]
automation-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
