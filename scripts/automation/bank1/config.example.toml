# Optional: the push notifications' words. Leave a block or line out to keep what's shown
# here. Any of these can go in {braces}: {command}, {process}, {run_id}, {ok}, {unchanged},
# {failed}, and {total}. Keep them short, since they're read on a watch.
[notifications.pass]
title = "{command}"
message = "PASS"

[notifications.fail]
title = "{command}"
message = "FAIL"

# Instead of [notifications.fail], when the device verification wasn't approved in time.
# Nothing else was tried.
[notifications.mfa_failed]
title = "{command}"
message = "FAIL: verification timed out"

# Sent during the run, when the site asks to verify the device with a push to its app.
[notifications.mfa_needed]
title = "{command}"
message = "Approve the sign-in on your phone"
