[project]
name = "bank1-portal"
version = "0.1.0"
description = "Automations for a bank's customer website, sharing one sign-in flow"
requires-python = ">=3.13,<3.14"
dependencies = [
    "automation-common",
    "pypdf>=6.0",
]

[project.scripts]
bank1-statements = "bank1_portal.main:main"
bank1-activity = "bank1_portal.activity_main:main"

[tool.uv.sources]
automation-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
