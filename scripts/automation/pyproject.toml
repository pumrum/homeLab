# Workspace root for every automation. `uv sync` here installs all members
# and the dev tools into one .venv, from the single committed uv.lock.
[project]
name = "automation"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = ["automation-agent", "automation-common", "fidelity-nav"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["agent", "common", "fidelity"]

[tool.uv.sources]
automation-agent = { workspace = true }
automation-common = { workspace = true }
fidelity-nav = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["agent/tests", "common/tests", "fidelity/tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["automation_agent", "automation_common", "fidelity_nav"]

[tool.ruff.lint.per-file-ignores]
# CLI tool for people (print is fine); embeds FakeBank's HTML/JS as long lines
"tools/*" = ["T20", "E501"]
