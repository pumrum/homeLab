# Workspace root for every automation. `uv sync` here installs all members
# and the dev tools into one .venv, from the single committed uv.lock.
[project]
name = "automation"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = ["automation-agent", "automation-common", "bank1-portal", "buildium-portal", "fidelity-nav", "innago-portal", "invoices-sync"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["agent", "bank1", "buildium", "common", "fidelity", "innago", "invoices"]

[tool.uv.sources]
automation-agent = { workspace = true }
automation-common = { workspace = true }
bank1-portal = { workspace = true }
buildium-portal = { workspace = true }
fidelity-nav = { workspace = true }
innago-portal = { workspace = true }
invoices-sync = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["agent/tests", "bank1/tests", "buildium/tests", "common/tests", "fidelity/tests", "innago/tests", "invoices/tests"]
addopts = "--import-mode=importlib"
# A hung test fails with a stack trace, instead of holding up CI for hours
timeout = 120
timeout_method = "thread"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["automation_agent", "automation_common", "bank1_portal", "buildium_portal", "fidelity_nav", "innago_portal", "invoices_sync"]

[tool.ruff.lint.per-file-ignores]
# CLI tool for people (print is fine); embeds FakeBank's HTML/JS as long lines
"tools/*" = ["T20", "E501"]
