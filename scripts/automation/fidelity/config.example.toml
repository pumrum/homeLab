# fidelity-nav configuration. Copy to C:\automation\fidelity\config.toml and
# replace the placeholders. Every text value is quoted. Add one [[funds]]
# block per fund; the run fails with a clear message until no placeholder is left.

[[funds]]
symbol = "XXXXX"        # fund symbol or ID, capital letters and digits
url = "https://..."     # the fund's summary page

# Optional: copy new rows to a Google Sheet (see README "Google Sheet").
# Remove the leading "# " from the three lines below to turn it on.
# [sheet]
# spreadsheet_id = "<ID>"   # from .../spreadsheets/d/<ID>/edit
# worksheet = "NAV"         # the tab name

# Optional: the push notifications' words. Leave a block or line out to keep what's shown
# here. Any of these can go in {braces}: {command}, {process}, {run_id}, {ok}, {unchanged},
# {failed}, and {total}. Keep them short, since they're read on a watch.
[notifications.pass]
title = "{command}"
message = "PASS"

[notifications.fail]
title = "{command}"
message = "FAIL"
