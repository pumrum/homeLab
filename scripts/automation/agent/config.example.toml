# automation-agent configuration. Copy to C:\automation\agent\config.toml and
# replace the placeholders. Every text value is quoted. The MQTT login goes in
# Credential Manager as automation/mqtt, never here.

[mqtt]
host = "<broker host name>"     # must match the name on the broker's certificate
port = 8883
tls = true                      # verifies the broker's certificate and host name
topic_prefix = "automation"     # use a different one on a test machine
# Only if your own CA signed the broker's certificate. Remove the leading "# ":
# ca_file = "C:\\automation\\agent\\mqtt-ca.crt"

# One block per job Home Assistant may run. Nothing else can be run.
[[jobs]]
name = "<job>"                  # lowercase; used in topics and Home Assistant names
command = "<console script>"    # its name only, as in the process's pyproject.toml
timeout_minutes = 30            # a run longer than this is stopped and reported as FAIL
