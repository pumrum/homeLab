# valheim/ holds config files generated by game mods and re-uploaded as-is,
# so the whitespace fixers skip it.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^valheim/
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^valheim/
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
